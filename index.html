<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beauty Planner</title>
<meta name="theme-color" content="#c2496f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Beauty Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>

<style>
/* Layout: iOS-native single column — large titles, grouped inset lists, bottom sheets, tab bar */
:root{
  --bg:#f6f0f2; --surface:#ffffff; --surface-2:#efe5e9; --ink:#2a1e23; --muted:#86757d; --line:#ebdfe4;
  --accent:#c2496f; --accent-ink:#ffffff; --accent-soft:#f7e0e8;
  --ok:#2a8f61; --ok-soft:#ddf2e6; --warn:#a96d0c; --warn-soft:#fbefd6;
  --bad:#c93a3a; --bad-soft:#fbe3e3; --info:#2f73ad; --info-soft:#e0ecf7;
  --scrim:rgba(40,15,25,.38); --tabbar:rgba(255,255,255,.9); --shadow:0 -6px 30px rgba(90,30,55,.14);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --r-lg:16px; --r-md:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141012; --surface:#1f191c; --surface-2:#2b2327; --ink:#f4eaee; --muted:#a6959d; --line:#342a2f;
  --accent:#e8789c; --accent-ink:#1a0d12; --accent-soft:#3e2331;
  --ok:#55c792; --ok-soft:#173528; --warn:#e7ab45; --warn-soft:#3a2d14;
  --bad:#f07171; --bad-soft:#3e1d20; --info:#71aee3; --info-soft:#1a2c3e;
  --scrim:rgba(0,0,0,.55); --tabbar:rgba(31,25,28,.9); --shadow:0 -6px 30px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141012; --surface:#1f191c; --surface-2:#2b2327; --ink:#f4eaee; --muted:#a6959d; --line:#342a2f;
  --accent:#e8789c; --accent-ink:#1a0d12; --accent-soft:#3e2331;
  --ok:#55c792; --ok-soft:#173528; --warn:#e7ab45; --warn-soft:#3a2d14;
  --bad:#f07171; --bad-soft:#3e1d20; --info:#71aee3; --info-soft:#1a2c3e;
  --scrim:rgba(0,0,0,.55); --tabbar:rgba(31,25,28,.9); --shadow:0 -6px 30px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body.has-sheet{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink)}
.vh{position:absolute!important;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}

.screen{max-width:640px;margin:0 auto;padding:8px 16px calc(116px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:12px 0 18px}
.top>div{min-width:0}
.eyebrow{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font-family:var(--font-display);font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.01em;margin:3px 0 0;text-wrap:balance}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:22px}
.stat{background:var(--surface);border-radius:var(--r-md);padding:10px 12px;min-width:0}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--muted)}

.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 4px 8px}
.sec h2{font-size:20px;margin:0;font-weight:700}
.link{color:var(--accent);font-size:15px}
.link.strong{font-weight:600}
.group{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;margin-bottom:24px}
.row{display:flex;gap:12px;align-items:center;width:100%;padding:11px 14px;border-bottom:1px solid var(--line);min-height:52px;text-decoration:none}
.row:last-child{border-bottom:0}
button.row:active{background:var(--surface-2)}
.time{width:50px;flex-shrink:0;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.time small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.bar{width:4px;align-self:stretch;border-radius:4px;flex-shrink:0;background:var(--accent)}
.info{flex:1;min-width:0}
.info b{display:block;font-size:15.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.is-cancel .info b{text-decoration:line-through;color:var(--muted)}
.chip{font-size:11.5px;padding:3px 8px;border-radius:999px;font-weight:600;white-space:nowrap;flex-shrink:0}
.chip-accent{background:var(--accent-soft);color:var(--accent)}
.chip-ok{background:var(--ok-soft);color:var(--ok)}
.chip-warn{background:var(--warn-soft);color:var(--warn)}
.chip-bad{background:var(--bad-soft);color:var(--bad)}
.chip-info{background:var(--info-soft);color:var(--info)}
.chev{color:var(--muted);font-size:22px;line-height:1;flex-shrink:0}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.45}
.banner{display:flex;gap:10px;align-items:center;background:var(--accent-soft);border-radius:var(--r-md);padding:10px 12px;margin-bottom:16px;font-size:13.5px;line-height:1.4}
.banner.warn{background:var(--warn-soft)}
.banner .grow{flex:1;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none;font-size:15.5px;text-align:center}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.btns>.btn{flex:1 1 0;min-width:120px}

.task{display:flex;gap:12px;align-items:center;padding:4px 14px;border-bottom:1px solid var(--line);min-height:50px}
.task:last-child{border-bottom:0}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex-shrink:0;display:grid;place-items:center;opacity:.8}
.ck.done{background:var(--accent);border-color:var(--accent);opacity:1}
.ck.done::after{content:'';width:9px;height:5px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.task-text{flex:1;min-width:0;padding:10px 0;font-size:15.5px}
.task-text small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.task-text small.late{color:var(--bad)}
.task.done .task-text span{text-decoration:line-through;color:var(--muted)}
.addbar{display:flex;gap:8px;margin-bottom:14px}
.addbar .inp{flex:1;min-width:0}
.addbar input[type=date]{flex:0 0 auto;width:auto;max-width:150px}

.fab{position:fixed;right:max(20px,calc(50% - 300px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 22px rgba(194,73,111,.45);z-index:20}
.fab svg{width:28px;height:28px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tabbar);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{max-width:640px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;font-size:10.5px;font-weight:500;color:var(--muted);text-align:center}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--accent)}

.cal-head{display:flex;align-items:center;justify-content:space-between;margin:0 4px 8px}
.cal-head b{font-size:18px}
.cal-nav{display:flex;gap:4px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--surface)}
.icon-btn svg{width:20px;height:20px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;background:var(--surface);border-radius:var(--r-lg);padding:8px;margin-bottom:14px}
.cal-wd{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.cal-d{aspect-ratio:1/1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;font-size:15px;font-variant-numeric:tabular-nums}
.cal-d.out{opacity:.35}
.cal-d.today{color:var(--accent);font-weight:700}
.cal-d.sel{background:var(--accent);color:var(--accent-ink);font-weight:700}
.dots{display:flex;gap:2px;height:5px;margin-top:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.sel .dots i{background:var(--accent-ink)}
.pills{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 4px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:7px 13px;border-radius:999px;background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap}
.pill.on{background:var(--ink);color:var(--bg)}
.free{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.free:last-child{border-bottom:0}
.free b{width:100%;font-size:13px;color:var(--muted);font-weight:600}
.slot{padding:6px 10px;border-radius:9px;background:var(--ok-soft);color:var(--ok);font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.slot.off{background:var(--surface-2);color:var(--muted);font-weight:500}

.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:2px;gap:2px;margin-bottom:14px}
.seg button{flex:1;min-width:0;padding:8px 4px;border-radius:8px;font-size:13.5px;font-weight:500;text-align:center}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}
.seg.wrap{flex-wrap:wrap}
.seg.wrap button{flex:1 1 30%}

.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:11px;padding:0 10px;height:42px;margin-bottom:14px;color:var(--muted)}
.search svg{width:18px;height:18px;flex-shrink:0}
.search input{flex:1;border:0;background:none;outline:none;height:100%;min-width:0;font-size:16px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--surface-2);color:var(--ink);flex-shrink:0}

.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:640px;max-height:93%;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sheet-full{height:93%}
.sheet::before{content:'';position:absolute;top:6px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--line)}
.fresh .sheet{animation:up .3s cubic-bezier(.2,.8,.2,1)}
.fresh .scrim{animation:fade .3s}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:18px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-head b{font-size:16px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head>:first-child{justify-self:start}
.sheet-head>:last-child{justify-self:end}
.sheet-head .link{font-size:16px}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(28px + env(safe-area-inset-bottom,0px));flex:1}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.lbl{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding-left:4px}
.inp{width:100%;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 12px;font-size:16px;-webkit-appearance:none;appearance:none}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea.inp{min-height:96px;resize:vertical;line-height:1.4}
input[type=date].inp,input[type=time].inp{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.svc-chips{display:flex;flex-wrap:wrap;gap:8px}
.svc{padding:8px 12px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font-size:14px;display:flex;gap:7px;align-items:center}
.svc i{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.svc small{color:var(--muted)}
.svc.on{border-color:var(--accent);background:var(--accent-soft)}
.pick-list{background:var(--surface);border-radius:11px;overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.pick-list:empty{display:none}
.pick{display:flex;justify-content:space-between;gap:8px;width:100%;padding:11px 12px;border-bottom:1px solid var(--line);font-size:15px}
.pick:last-child{border:0}
.pick small{color:var(--muted)}
.pick.new{color:var(--accent);font-weight:600}
.chosen{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 12px}
.chosen .av{width:34px;height:34px;font-size:13px;background:var(--accent-soft);color:var(--accent)}
.warnbox{background:var(--warn-soft);padding:10px 12px;border-radius:11px;font-size:14px;margin-bottom:14px;line-height:1.4}
.warnbox:empty{display:none}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted);flex-shrink:0}
.kv b{font-weight:500;text-align:right;min-width:0;overflow-wrap:anywhere}
.hint{font-size:13px;color:var(--muted);margin:-6px 4px 14px;line-height:1.45}
.small{font-size:13px;color:var(--muted)}
.note-box{background:var(--surface);border-radius:var(--r-lg);padding:12px 14px;font-size:15px;white-space:pre-wrap;margin-bottom:24px;overflow-wrap:anywhere;line-height:1.45}
.confirm{background:var(--bad-soft);border-radius:var(--r-md);padding:12px;margin-top:8px}
.confirm p{margin:0 0 10px;font-size:14px}

.phead{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;margin-bottom:16px}
.phead .av{width:74px;height:74px;font-size:25px;background:var(--accent-soft);color:var(--accent)}
.phead h2{margin:6px 0 0;font-size:22px;font-family:var(--font-display)}
.phone-line{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums;user-select:text;-webkit-user-select:text}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:18px}
.act{background:var(--surface);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;color:var(--accent);font-weight:600;text-align:center}
.act svg{width:22px;height:22px}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:24px}
.photos>*{aspect-ratio:1/1;max-width:100%;border-radius:10px;overflow:hidden;background:var(--surface);display:grid;place-items:center;color:var(--accent);position:relative;cursor:pointer}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos svg{width:26px;height:26px}
.bigphoto{width:100%;border-radius:var(--r-lg);display:block;margin-bottom:14px}

.barrow{padding:10px 14px;border-bottom:1px solid var(--line)}
.barrow:last-child{border-bottom:0}
.barrow .t{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.barrow .t span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);flex-shrink:0}
.track{height:6px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:3px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px transparent}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.more-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex-shrink:0}
.more-ico svg{width:18px;height:18px}
.vars{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 16px}
.vars code{font-size:12.5px;background:var(--surface-2);padding:3px 7px;border-radius:6px;font-family:ui-monospace,Menlo,monospace}
.copyline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.copyline b{user-select:text;-webkit-user-select:text;overflow-wrap:anywhere}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;z-index:100;font-size:14.5px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}

.lock,.welcome{max-width:460px;margin:0 auto;padding:44px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.brandmark{width:78px;height:78px;border-radius:22px;background:var(--accent);display:grid;place-items:center;box-shadow:0 10px 26px rgba(194,73,111,.35)}
.brandmark svg{width:46px;height:46px}
.welcome h1{font-size:40px}
.welcome p{margin:0;color:var(--muted);line-height:1.5;max-width:34ch}
.welcome form,.welcome .stack{width:100%;text-align:left}
.users{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
.utile{display:flex;flex-direction:column;align-items:center;gap:7px;width:86px;font-size:13px;line-height:1.25}
.utile .av{width:62px;height:62px;font-size:19px;color:#fff}
.utile.on .av{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.dots4{display:flex;gap:18px;margin:4px 0}
.dots4 i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.dots4 i.f{background:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 24px;justify-content:center}
.key{width:72px;height:72px;border-radius:50%;background:var(--surface);font-size:28px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.key:active{background:var(--surface-2)}
.key.txt{background:none;font-size:15px;color:var(--accent)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@media (prefers-reduced-motion:reduce){.fresh .sheet,.fresh .scrim,.shake{animation:none}}
@media (max-width:360px){h1{font-size:30px}.keypad{grid-template-columns:repeat(3,64px);gap:12px 20px}.key{width:64px;height:64px}}
</style>

<div id="app"></div>
<div id="sheets"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';
var VERSION='1.0';

function userById(id){return DB.users.filter(function(u){return u.id===id})[0]}

function svcById(id){return DB.services.filter(function(s){return s.id===id})[0]}

function isActive(a){return a.status!=='cancelled'&&a.status!=='noshow'}
function firstName(n){return String(n||'').split(' ')[0]}

function freeWindows(date,masterId){
  var o=toMin(DB.salon.open),c=toMin(DB.salon.close);
  var busy=DB.appts.filter(function(a){return a.date===date&&a.masterId===masterId&&isActive(a)}).map(function(a){return [toMin(a.time),toMin(a.time)+Number(a.dur)]}).sort(function(x,y){return x[0]-y[0]});
  var cur=o;
  if(date===today()){var n=new Date();cur=Math.max(cur,Math.ceil((n.getHours()*60+n.getMinutes())/15)*15)}
  if(date<today())return [];
  var res=[];
  busy.forEach(function(b){if(b[0]-cur>=30)res.push([cur,b[0]]);cur=Math.max(cur,b[1])});
  if(c-cur>=30)res.push([cur,c]);
  return res;
}
function bdayIn(c,days){
  if(!c.birthday)return -1;
  var md=c.birthday.slice(-5),t=parseYmd(today()),y=t.getFullYear();
  var d=parseYmd(y+'-'+md);if(d<t)d=parseYmd((y+1)+'-'+md);
  var diff=Math.round((d-t)/86400000);return diff<=days?diff:-1;
}

var SHEETS=[];

}
function renderSheets(all){
  var root=$('#sheets');
  while(root.children.length>SHEETS.length)root.lastElementChild.remove();
  SHEETS.forEach(function(d,i){
    var el=root.children[i];
    if(!el||el._def!==d){
      var n=document.createElement('div');n.className='sheet-wrap fresh';n._def=d;n.innerHTML=sheetInner(d);
      if(el)root.replaceChild(n,el);else root.appendChild(n);
      setTimeout(function(){n.classList.remove('fresh')},350);
      if(d.after)d.after(n);
    }else if(all&&!d.form){
      var b=el.querySelector('.sheet-body'),sc=b?b.scrollTop:0;el.innerHTML=sheetInner(d);
      var b2=el.querySelector('.sheet-body');if(b2)b2.scrollTop=sc;if(d.after)d.after(el);
    }
  });
  document.body.classList.toggle('has-sheet',SHEETS.length>0);
}

  // exclude the record being edited from busy time
  if(F.id){var me=DB.appts.filter(function(x){return x.id===F.id})[0];if(me&&me.date===d&&me.masterId===m){var saved=me.status;me.status='cancelled';w=freeWindows(d,m);me.status=saved}}

    h+='<div class="stats"><div class="stat"><b>'+money(rev).replace(' ₽','')+'</b><span>₽ выручка</span></div><div class="stat"><b>'+done.length+'</b><span>'+plural(done.length,['визит','визита','визитов'])+'</span></div><div class="stat"><b>'+(done.length?money(rev/done.length).replace(' ₽',''):'—')+'</b><span>средний чек</span></div></div>';

A.saveAppt=function(){
  var F=topSheet().data,clientId=F.clientId,nm='';
  if(!clientId){nm=gv('af-nname').trim();if(!nm){afWarn('Выберите клиента из базы или добавьте нового.');return}}
  if(!F.serviceIds.length){afWarn('Выберите хотя бы одну услугу.');return}
  var date=gv('af-date'),time=gv('af-time'),masterId=gv('af-master'),dur=Number(gv('af-dur'))||60,price=Number(gv('af-price'))||0;
  if(!date||!time){afWarn('Укажите дату и время.');return}
  if(!masterId){afWarn('Добавьте мастера: Ещё → Мастера и ПИН-коды.');return}
  var s=toMin(time),e=s+dur;
  if(!F.conflictOk){
    var clash=DB.appts.filter(function(x){return x.id!==F.id&&x.masterId===masterId&&x.date===date&&isActive(x)&&toMin(x.time)<e&&toMin(x.time)+Number(x.dur)>s})[0];
    if(clash){var cc=clientById(clash.clientId);afWarn('У мастера уже есть запись '+clash.time+'–'+fromMin(toMin(clash.time)+Number(clash.dur))+(cc?' ('+cc.name+')':'')+'. Нажмите «Сохранить» ещё раз, чтобы записать всё равно.');F.conflictOk=true;return}
    if(s<toMin(DB.salon.open)||e>toMin(DB.salon.close)){afWarn('Запись выходит за часы работы салона ('+DB.salon.open+'–'+DB.salon.close+'). Нажмите «Сохранить» ещё раз, чтобы записать всё равно.');F.conflictOk=true;return}
  }
  if(!clientId){var nc={id:uid(),name:nm,phone:gv('af-nphone').trim(),tg:'',birthday:'',notes:'',photos:[],created:today()};DB.clients.push(nc);clientId=nc.id}
  var rec={clientId:clientId,serviceIds:F.serviceIds.slice(),masterId:masterId,date:date,time:time,dur:dur,price:price,status:F.status,note:gv('af-note').trim()};
  var isNew=!F.id;
  if(F.id){var a=DB.appts.filter(function(x){return x.id===F.id})[0];if(a.date!==date||a.time!==time)a.reminded=false;Object.assign(a,rec)}
  else{rec.id=uid();rec.reminded=false;rec.created=today();DB.appts.push(rec)}
  if(!save())return;
  closeSheet();if(S.tab==='calendar'){S.calDate=date;S.calMonth=date.slice(0,7)}refresh();
  toast(isNew?'Записано: '+dateRel(date).toLowerCase()+', '+time:'Запись изменена');
};

  el.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b===el)});
  var c=clientById(D.clientId),a=D.apptId?DB.appts.filter(function(x){return x.id===D.apptId})[0]:null;
  g('msg-text').value=fillTpl(DB.templates[D.tpl],c,(D.tpl==='bday')?null:a);updateMsgLinks();
};
I.msgEdit=function(){updateMsgLinks()};
A.msgCopy=function(){copyText(gv('msg-text'));markSent()};
A.msgSent=function(el){
  var D=topSheet().data,c=clientById(D.clientId);
  if(el.dataset.ch!=='tg'&&!normPhone(c&&c.phone)){toast('У клиента не указан телефон');return}
  if(el.dataset.ch==='tg'){try{navigator.clipboard.writeText(gv('msg-text')).catch(function(){})}catch(e){}}
  markSent();
};
function markSent(){var D=topSheet().data;if((D.tpl==='remind'||D.tpl==='confirm')&&D.apptId){var a=DB.appts.filter(function(x){return x.id===D.apptId})[0];if(a&&!a.reminded){a.reminded=true;if(D.tpl==='confirm'&&a.status==='new')a.status='confirmed';save();renderMain();renderSheets(true)}}}

/* planner */
A.plFilter=function(el){S.plDone=el.dataset.v==='1';renderMain()};
A.addTask=function(){var t=gv('pl-new').trim();if(!t){var i=g('pl-new');if(i)i.focus();return}DB.tasks.push({id:uid(),text:t,date:gv('pl-date'),done:false});save();renderMain();var n=g('pl-new');if(n)n.focus();toast('Задача добавлена')};
A.toggleTask=function(el){var x=DB.tasks.filter(function(t){return t.id===el.dataset.id})[0];if(!x)return;x.done=!x.done;x.doneAt=x.done?today():null;save();refresh()};
A.editTask=function(el){sheetTask(el.dataset.id)};
A.saveTask=function(){var D=topSheet().data,x=DB.tasks.filter(function(t){return t.id===D.id})[0],t=gv('tf-text').trim();if(!t)return;x.text=t;x.date=gv('tf-date');save();closeSheet();refresh()};
A.delTask=function(el){DB.tasks=DB.tasks.filter(function(t){return t.id!==el.dataset.id});save();closeSheet();refresh();toast('Задача удалена')};
A.clearDone=function(){var n=DB.tasks.filter(function(t){return t.done}).length;DB.tasks=DB.tasks.filter(function(t){return !t.done});save();renderMain();toast('Удалено задач: '+n)};

/* more */
A.theme=function(el){var v=el.dataset.v;lset(THEME_KEY,v);applyTheme();renderMain()};
A.openSalon=function(){sheetSalon()};
A.saveSalon=function(){var o=gv('sl-open')||'09:00',c=gv('sl-close')||'20:00';if(toMin(c)<=toMin(o)){toast('Время закрытия должно быть позже открытия');return}DB.salon={name:gv('sl-name').trim(),address:gv('sl-addr').trim(),phone:gv('sl-phone').trim(),open:o,close:c};save();closeSheet();refresh();toast('Сохранено')};
A.openServices=function(){sheetServices()};
A.editService=function(el){sheetServiceForm(el.dataset.id||null)};
A.pickColor=function(el){topSheet().data.color=el.dataset.v;el.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b===el)})};
A.saveService=function(){var D=topSheet().data,name=gv('sf-name').trim();if(!name){g('sf-warn').textContent='Укажите название услуги.';return}
  var rec={name:name,dur:Number(gv('sf-dur'))||60,price:Number(gv('sf-price'))||0,color:D.color};
  if(D.id)Object.assign(svcById(D.id),rec);else DB.services.push(Object.assign({id:uid()},rec));save();closeSheet();refresh();toast('Сохранено')};
A.delService=function(el){DB.services=DB.services.filter(function(s){return s.id!==el.dataset.id});save();closeSheet();refresh();toast('Услуга удалена')};
A.openUsers=function(){sheetUsers()};
A.editUser=function(el){sheetUserForm(el.dataset.id||null)};
A.ufRole=function(el){topSheet().data.role=el.dataset.v;el.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b===el)})};
A.ufMaster=function(el){topSheet().data.isMaster=el.dataset.v==='1';el.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b===el)})};
A.saveUser=function(){
  var D=topSheet().data,w=g('uf-warn'),name=gv('uf-name').trim(),pin=gv('uf-pin').trim();
  if(!name){w.textContent='Укажите имя.';return}
  if(!/^\d{4}$/.test(pin)){w.textContent='ПИН-код — ровно 4 цифры.';return}
  if(DB.users.some(function(u){return u.id!==D.id&&u.pin===pin})){w.textContent='Такой ПИН-код уже у другого сотрудника. Выберите другой.';return}
  if(D.id&&D.role!=='admin'&&DB.users.filter(function(u){return u.role==='admin'&&u.id!==D.id}).length===0){w.textContent='В салоне должен остаться хотя бы один администратор.';return}
  var rec={name:name,pin:pin,role:D.role,isMaster:D.isMaster,color:D.color};
  if(D.id){Object.assign(userById(D.id),rec);if(D.id===S.user.id)S.user=userById(D.id)}else DB.users.push(Object.assign({id:uid()},rec));
  save();closeSheet();refresh();toast('Сохранено');
};
A.delUser=function(el){var id=el.dataset.id,n=DB.appts.filter(function(a){return a.masterId===id&&a.date>=today()&&isActive(a)}).length;
  if(n){toast('У сотрудника '+n+' '+plural(n,['будущая запись','будущие записи','будущих записей'])+'. Сначала перенесите их другому мастеру.',4000);return}
  DB.users=DB.users.filter(function(u){return u.id!==id});save();closeSheet();refresh();toast('Сотрудник удалён')};
A.openTemplates=function(){sheetTemplates()};
A.saveTemplates=function(){Object.keys(TPL_NAMES).forEach(function(k){DB.templates[k]=gv('tp-'+k)});save();closeSheet();toast('Шаблоны сохранены')};
A.resetTemplates=function(){Object.keys(TPL_NAMES).forEach(function(k){g('tp-'+k).value=DEFAULT_TPL[k]});toast('Нажмите «Сохранить», чтобы применить')};
A.openStats=function(){sheetStats()};
A.statMonth=function(el){var D=topSheet().data,p=D.month.split('-').map(Number);D.month=ymd(new Date(p[0],p[1]-1+Number(el.dataset.d),1)).slice(0,7);rerenderTop()};
A.openAbout=function(){sheetAbout()};

/* backup */
function backupName(){return 'BeautyPlanner_'+(DB.salon.name||'salon').replace(/[^\wа-яё]+/gi,'_')+'_'+today()+'.json'}
function markBackup(){DB.lastBackup=today();save();refresh()}
A.openBackup=function(){sheetBackup()};
A.exportFile=function(){
  var json=JSON.stringify(DB),name=backupName();
  try{var file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).then(markBackup,function(e){if(e&&e.name!=='AbortError')fallbackDownload(json,name)});return}}catch(e){}
  fallbackDownload(json,name);
};
function fallbackDownload(json,name){
  try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);markBackup();toast('Файл сохранён. Если он не появился, используйте «Копировать текстом».',4000)}
  catch(e){toast('Сохранить файл не получилось. Используйте «Копировать текстом».',4000)}
}
A.exportCopy=function(){var json=JSON.stringify(DB);try{navigator.clipboard.writeText(json).then(function(){markBackup();toast('Копия скопирована. Вставьте её в «Заметки» или отправьте себе в мессенджер.',4000)},function(){showBackupText(json)})}catch(e){showBackupText(json)}};
function showBackupText(json){var t=g('bk-text');if(t){t.value=json;t.focus();t.select();toast('Текст выделен в поле ниже — скопируйте его вручную',4000)}}
function validBackup(o){return o&&Array.isArray(o.users)&&Array.isArray(o.clients)&&Array.isArray(o.appts)&&Array.isArray(o.services)&&o.users.length>0&&o.salon}
function stageImport(txt){var o;try{o=JSON.parse(txt)}catch(e){toast('Это не файл копии Beauty Planner',3000);return}
  if(!validBackup(o)){toast('Файл не похож на копию Beauty Planner',3000);return}
  o.tasks=o.tasks||[];o.templates=Object.assign({},DEFAULT_TPL,o.templates||{});
  var d=topSheet().data;d.pending=o;d.confirm='import';rerenderTop();var b=$('#sheets').lastElementChild.querySelector('.sheet-body');if(b)b.scrollTop=b.scrollHeight}
C.importFile=function(el){var f=el.files&&el.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){stageImport(String(fr.result))};fr.readAsText(f)};
A.importText=function(){var t=gv('bk-text').trim();if(!t){toast('Вставьте текст копии в поле');return}stageImport(t)};
A.importDo=function(){var d=topSheet().data;DB=d.pending;DB.lastBackup=DB.lastBackup||today();save();closeAll();S.user=null;S.lockUser=null;sset(SESS_KEY,null);renderMain();toast('Данные восстановлены. Войдите под своим ПИН-кодом.',3500)};
A.askWipe=function(){topSheet().data.confirm='wipe';rerenderTop();var b=$('#sheets').lastElementChild.querySelector('.sheet-body');if(b)b.scrollTop=b.scrollHeight};
A.wipe=function(){DB=null;try{localStorage.removeItem(KEY)}catch(e){}closeAll();S.user=null;S.setup=true;sset(SESS_KEY,null);renderMain();window.scrollTo(0,0)};

/* ---------- events ---------- */
document.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t)return;var f=A[t.dataset.act];if(f)f(t,e)});
document.addEventListener('change',function(e){var t=e.target.closest('[data-change]');if(t&&C[t.dataset.change])C[t.dataset.change](t,e)});
document.addEventListener('input',function(e){var t=e.target.closest('[data-input]');if(t&&I[t.dataset.input])I[t.dataset.input](t,e)});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&SHEETS.length){closeSheet();return}
  if(e.key==='Enter'&&e.target.id==='pl-new'){e.preventDefault();A.addTask()}
  if(DB&&!S.user&&S.lockUser&&/^\d$/.test(e.key))A.pinKey({dataset:{k:e.key}});
  if(DB&&!S.user&&S.lockUser&&e.key==='Backspace')A.pinDel();
});
var hiddenAt=0;
document.addEventListener('visibilitychange',function(){
  if(document.hidden){hiddenAt=Date.now();return}
  if(S.user&&hiddenAt&&Date.now()-hiddenAt>5*60*1000){A.lock()}
  else if(S.user)renderMain();
});

/* ---------- boot ---------- */
applyTheme();load();
if(DB){
  DB.templates=Object.assign({},DEFAULT_TPL,DB.templates||{});DB.tasks=DB.tasks||[];
  var sid=sget(SESS_KEY);if(sid){var su=userById(sid);if(su)S.user=su}
}
renderMain();
if('serviceWorker' in navigator&&location.protocol==='https:'&&window.self===window.top){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}
})();
</script>

</body></html>
